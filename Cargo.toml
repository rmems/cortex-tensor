[package]
name = "cortex-tensor"
version = "0.1.0"
edition = "2024"
# Development toolchain and MSRV are the same pin. Keep this equal to
# `rust-toolchain.toml` `channel` and the CI / `.agents/setup` install.
rust-version = "1.99.0"
description = "Backend-neutral ANN stage layer and deterministic Vec reference backend for hybrid ANN/SNN systems."
authors = ["Raul Cardenas Montoya"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rmems/cortex-tensor"
homepage = "https://github.com/rmems/cortex-tensor"
# crates.io surface: keep licenses, README, CHANGELOG, sources, and tests.
# Drop agent/CI/dev-only paths. Hidden git-tracked files still pack unless
# listed here (e.g. .gitignore). `rust-toolchain.toml` stays in the git repo
# so local and CI builds use the pinned toolchain; MSRV for dependents is
# `rust-version` above.
exclude = [
    "/.agents/",
    "/.coderabbit.yaml",
    "/.github/",
    "/.gitignore",
    "/AGENTS.md",
    "/codecov.yml",
    "/rust-toolchain.toml",
]

[lib]
name = "cortex_tensor"
path = "src/lib.rs"

[features]
default = []
# SNN backend adapter: `neuromod::SpikingNetwork` behind `snn::SnnBackend`.
# Optional so the core contract stays dependency-light; other backend crates
# are evaluated individually, not added wholesale.
neuromod = ["dep:neuromod"]
# SNN encoder adapter: `axon-encoder` spike encoders behind `snn::SnnEncoder`.
axon-encoder = ["dep:axon-encoder"]
# ANN execution adapter: Candle CPU modules behind `adapter::CandleExecutor`.
# CUDA, cuDNN, MKL, Accelerate, and Metal stay off — this crate does not ship
# GPU kernels. Default features of both crates are empty; disable them
# explicitly so a future default cannot pull those backends in.
candle = ["dep:candle-core", "dep:candle-nn"]
# Burn adapter slot. Not in `default`. This stays a structured stub and does
# not depend on the `burn` crate. burn 0.21's rust-version 1.92 is a minimum
# and is compatible with this pin; omitting the dependency is policy, not a
# toolchain conflict.
burn = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.10"
# Portable, version-stable stream for the `*_seeded` constructors (StdRng is not).
rand_chacha = "0.10"
neuromod = { version = "0.7", optional = true }
axon-encoder = { version = "0.5", optional = true }
# Checkpoint substrate. Validated against engram-parser 0.3.0.
# `safetensors` is required so GGUF and Safetensors share one open path.
# `mmap` stays off: this crate does not own checkpoint mmap policy (RM-1265).
engram-parser = { version = "0.3.0", default-features = false, features = ["safetensors"] }
candle-core = { version = "0.11", optional = true, default-features = false }
candle-nn = { version = "0.11", optional = true, default-features = false }

[profile.release]
opt-level = 3
lto = "fat"

[workspace]
# Standalone: detach from any parent Cargo workspace.

[patch.crates-io]
# zip 8.6.0 was yanked on 2026-10-16. candle-core 0.11 still requires
# zip ^8.6.0, and 9.0.3 is outside that range. compat/zip is 9.0.3 behind
# the 8.6 method names candle calls. Patches apply only when this package
# is the Cargo root (CI and local builds).
zip = { path = "compat/zip" }
