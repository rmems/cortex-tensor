[package]
name = "cortex-tensor"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Backend-neutral ANN stage layer and deterministic Vec reference backend for hybrid ANN/SNN systems."
authors = ["Raul Cardenas Montoya"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rmems/cortex-tensor"
homepage = "https://github.com/rmems/cortex-tensor"

[lib]
name = "cortex_tensor"
path = "src/lib.rs"

[features]
default = []
# SNN backend adapter: `neuromod::SpikingNetwork` behind `snn::SnnBackend`.
# Optional so the core contract stays dependency-light; other backend crates
# are evaluated individually, not added wholesale.
neuromod = ["dep:neuromod"]
# SNN encoder adapter: `axon-encoder` spike encoders behind `snn::SnnEncoder`.
axon-encoder = ["dep:axon-encoder"]
# Candle adapter slot. Not in `default`. v0.3 keeps this a structured stub and
# does not depend on the `candle-core` crate so core stays framework-free.
candle = []
# Burn adapter slot. Not in `default`. v0.3 keeps this a structured stub and
# does not depend on the `burn` crate. burn 0.21's rust-version 1.92 is a
# minimum and is compatible with this pin; omitting the dependency is policy,
# not a toolchain conflict.
burn = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.10"
rayon = "1.7"
memmap2 = "0.9"
half = "2"
neuromod = { version = "0.6", optional = true }
axon-encoder = { version = "0.5", optional = true }

[profile.release]
opt-level = 3
lto = "fat"

[workspace]
# Standalone: detach from any parent Cargo workspace.
