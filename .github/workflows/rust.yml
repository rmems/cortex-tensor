name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

# zizmor/excessive-permissions: default to read-only; steps needing more
# (e.g. reviewdog PR comments) declare it on the job/step.
permissions:
  contents: read
  # reviewdog posts clippy findings as PR review comments.
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
    # Pinned checkout + persist-credentials:false (Aikido high-sev / CodeRabbit zizmor / Codacy)
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    # Hosted images ship rustup; track the latest stable toolchain
    # explicitly instead of whatever version the image happens to carry.
    - name: Install Rust 1.99.0
      run: |
        rustup toolchain install 1.99.0 --component rustfmt --component clippy
        rustup default 1.99.0
        rustc --version
        cargo --version

    - name: Build
      run: cargo build --verbose --all-features

    - name: Run tests (all features)
      run: cargo test --verbose --all-features

    - name: Test zip compatibility facade
      run: |
        cargo test --verbose --manifest-path compat/zip/Cargo.toml
        cargo fmt --manifest-path compat/zip/Cargo.toml -- --check
        cargo clippy --manifest-path compat/zip/Cargo.toml --all-targets -- -D warnings

    - name: Run tests (default features)
      run: cargo test --verbose

    # Codecov coverage using cargo-llvm-cov (separate codecov.yml per plan; modeled on corinth-canal)
    - name: Install llvm-tools-preview
      run: rustup component add llvm-tools-preview
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
      with:
        tool: cargo-llvm-cov
    - name: Generate coverage report
      run: cargo llvm-cov --lib --no-default-features --locked --lcov --output-path lcov.info
    - name: Upload coverage to Codecov
      if: ${{ env.CODECOV_TOKEN != '' }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      with:
        token: ${{ env.CODECOV_TOKEN }}
        files: lcov.info
        fail_ci_if_error: true
        verbose: true

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    # Rustdoc gate: broken/private/redundant intra-doc links fail the build (#113).
    - name: Rustdoc (-D warnings)
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --no-deps --all-features

    # reviewdog for inline PR comments from clippy (addresses chore reviewdog integration)
    - name: Setup reviewdog
      uses: reviewdog/action-setup@18c694f622bf52d60f95ecf838462ed7971c0add
    - name: Clippy with reviewdog (PR comments)
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CARGO_INCREMENTAL: 0   # force fresh warnings output (addresses CodeRabbit incremental cache Major)
      run: |
        cargo clippy --all-targets --all-features --message-format=json | \
          reviewdog -f=clippy -reporter=github-pr-review -level=warning || true
      # note: || true only for reporter step to not fail PR on comment issues; main clippy above fails hard.
    # Clippy is intentionally run twice: once as hard gate (-D warnings), second time piped to reviewdog
    # for inline PR comments (see devin/codacy feedback). This is deliberate and pre-existing pattern.

    # Snyk: pinned setup using exact SHA (for official Snyk logo in UI per Aikido), no || true on primary paths (CodeRabbit).
    # OSS scan prefers SBOM when a real one is generated (chatgpt-codex / Devin feedback); falls back to standard test.
    # `secrets` cannot be used in step `if:` conditions, so the gate step below
    # exposes whether SNYK_TOKEN exists as an output. When it is absent (fork PRs,
    # or the secret not yet added) every Snyk step is skipped, including the ~60 s
    # cargo-cyclonedx install, and a warning annotation + job summary make the
    # skip visible instead of a silent green no-op (#112). When the token exists
    # behavior is unchanged.
    # continue-on-error only on OSS to tolerate "no supported files" in some Rust setups (see raulmc-26r).
    - name: Check for SNYK_TOKEN
      id: snyk_gate
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        if [ -n "$SNYK_TOKEN" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Snyk skipped::SNYK_TOKEN is not set (fork PR or secret not added); dependency and SAST scans did NOT run."
          echo "### Snyk scans skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "\`SNYK_TOKEN\` is not available, so no Snyk dependency or code scan ran. Add the \`SNYK_TOKEN\` repo secret to enable them." >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Snyk setup (pinned SHA for branding)
      if: ${{ steps.snyk_gate.outputs.enabled == 'true' }}
      uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce
    - name: Generate CycloneDX SBOM (for Rust Snyk scans)
      if: ${{ steps.snyk_gate.outputs.enabled == 'true' }}
      run: |
        cargo install --locked cargo-cyclonedx 2>/dev/null || true
        # cargo-cyclonedx often fails or produces no/empty output on this crate
        # (due to edition = "2024"). We attempt it, then guarantee a usable (possibly minimal) file.
        cargo cyclonedx --format json -o sbom.cdx.json 2>/dev/null || true
        if [ ! -s sbom.cdx.json ]; then
          echo '{"bomFormat":"CycloneDX","specVersion":"1.5","version":1,"components":[]}' > sbom.cdx.json
        fi
    - name: Snyk test (open source / deps - Rust prefers SBOM)
      if: ${{ steps.snyk_gate.outputs.enabled == 'true' }}
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        # Only use SBOM path if it has real content; otherwise fall back to avoid empty scan.
        if [ -s sbom.cdx.json ] && grep -q '"components"' sbom.cdx.json && ! grep -q '"components": \[\]' sbom.cdx.json; then
          snyk sbom test --file=sbom.cdx.json --package-manager=rust --severity-threshold=high || \
          snyk test --all-projects --severity-threshold=high
        else
          echo "No usable SBOM (common limitation); using standard test"
          snyk test --all-projects --severity-threshold=high
        fi
      continue-on-error: true
    - name: Snyk code test (SAST)
      if: ${{ steps.snyk_gate.outputs.enabled == 'true' }}
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        snyk code test --severity-threshold=high
      # When token IS present, the step runs to completion and will fail the job on real high-severity findings.
      # No blanket continue-on-error, so security gate is effective for internal/PRs with secret.
