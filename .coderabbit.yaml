# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit config for rmems/cortex-tensor.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  fail_commit_status: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
  - '!**/target/**'
  path_instructions:
  - path: '**/*.rs'
    instructions: 'Rust edition 2024; `rust-version = "1.98.1"` and `rust-toolchain.toml` pins 1.98.1. Do not suggest downgrading the edition or using std/language APIs newer than the pinned toolchain/MSRV. CI gate: `cargo clippy --all-targets --all-features -- -D warnings`, `cargo test --all-features` and `cargo test` (default features). Flag anything that would fail `cargo fmt --check` or clippy `-D warnings`. Flag any new `unsafe` block. Features `neuromod`, `axon-encoder`, and `candle` are optional; `burn` is an optional stub that must not depend on the `burn` crate while MSRV is 1.98.1. Code must build and test with and without `--all-features`. `--all-features` must stay buildable on rustc 1.98.1, so do not add a `burn` crate dependency.'
  - path: src/moe/checkpoint.rs
    instructions: 'Scrutinize every `unsafe` block (currently in `src/moe/checkpoint.rs`): require a written safety justification covering aliasing, lifetimes, alignment and bounds; prefer a safe abstraction when one exists.'
  - path: '**/Cargo.toml'
    instructions: Cargo manifest. Call out new dependencies and feature changes, and keep `rust-version` / `edition` consistent with CI. Keep `rust-version` equal to the `rust-toolchain.toml` channel.
  - path: .github/workflows/**
    instructions: GitHub Actions workflows. Keep `permissions:` least-privilege and job commands in sync with the local gates documented in the repo. Every `uses:` is pinned to a full commit SHA today; new or bumped actions must be too.
  tools:
    clippy:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    biome:
      enabled: false
